<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EDE3">
<title>Share your experience | City Garden, Varanasi</title>
<meta name="description" content="Tell us how your celebration at City Garden went. We'll turn your notes into a review draft you can edit and post yourself.">

     so it stays out of the index and out of sitemap.xml. The footer link is still followed. -->
<meta name="robots" content="noindex, follow">
<link rel="icon" href="../images/logo-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --burg:#31070F; --wine:#570E20; --ivory:#F4EDE3; --parch:#EDE0C9; --paper:#FFFDFA;
  --gold:#B89561; --gold-lt:#DCBB7E; --gold-dk:#8E6A3A; --gold-soft:#F6EDDC;
  --ink:#2A1A1B; --muted:rgba(42,26,27,.72); --faint:rgba(42,26,27,.5);
  --line:rgba(87,14,32,.15); --line-2:rgba(87,14,32,.28);
  --green:#315044; --green-soft:#EDF3EF;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,.8,.2,1);
  --sh-sm:0 1px 2px rgba(42,26,27,.05);
  --sh-md:0 14px 36px -26px rgba(49,7,15,.4),0 2px 7px rgba(42,26,27,.05);
  --sh-lg:0 28px 70px -34px rgba(49,7,15,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
  background:radial-gradient(circle at 50% -10%,rgba(184,149,97,.16),transparent 36%),
             linear-gradient(180deg,#F6EFE6 0%,#EADFD1 100%);
  color:var(--ink);font-family:var(--sans);font-size:16px;min-height:100dvh;
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;
}
button,textarea,input{font:inherit}
button{touch-action:manipulation}
.serif{font-family:var(--serif)}
.shell{width:100%;max-width:500px;min-height:100dvh;background:var(--ivory);position:relative;overflow:hidden;display:flex;flex-direction:column}
.shell::before{content:"";position:absolute;inset:0 0 auto;height:200px;pointer-events:none;
  background:radial-gradient(circle at 16% 0%,rgba(184,149,97,.16),transparent 44%),
             radial-gradient(circle at 88% 8%,rgba(87,14,32,.08),transparent 40%)}
@media(min-width:560px){
  body{padding:30px 16px;align-items:flex-start}
  .shell{min-height:min(880px,calc(100dvh - 60px));border:1px solid rgba(184,149,97,.5);border-radius:26px;box-shadow:var(--sh-lg)}
}
/* Brand */
.brandbar{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:16px 20px 10px}
.brand-logo{display:block;width:62px;height:auto;flex:none}
.brand-name{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.1;letter-spacing:.01em;color:var(--burg)}
.brand-loc{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.14em;margin-top:3px}
.backbtn{margin-left:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,253,250,.75);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.18s var(--ease)}
.backbtn:hover{border-color:var(--line-2);color:var(--ink)}
/* Progress */
.progress{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:2px 20px 4px}
.progress span{height:3px;border-radius:99px;background:rgba(87,14,32,.12)}
.progress span.on{background:linear-gradient(90deg,var(--wine),var(--gold))}
.progress-meta{padding:3px 20px 0;color:var(--faint);font-size:11px;letter-spacing:.05em;display:flex;justify-content:flex-end}
/* Layout */
.main{position:relative;z-index:1;flex:1;padding:16px 20px 22px;display:flex;flex-direction:column}
.foot{position:relative;z-index:2;padding:0 20px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(244,237,227,0),var(--ivory) 26%)}
.kicker{color:var(--wine);font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;font-weight:600;margin-bottom:6px}
h1{font-family:var(--serif);font-size:32px;font-weight:500;line-height:1.14;letter-spacing:-.01em;margin:4px 0 9px;color:var(--burg)}
.sub{color:var(--muted);font-size:14.5px;line-height:1.56;margin:0 0 20px}
.note{display:flex;gap:9px;align-items:flex-start;background:rgba(255,253,250,.72);border:1px solid var(--line);border-radius:13px;padding:11px 12px;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:16px}
.note svg{color:var(--gold-dk);flex:none;margin-top:1px}
/* Ornament */
.orn{display:flex;align-items:center;gap:10px;max-width:170px;margin:20px auto}
.orn::before,.orn::after{content:"";height:1px;background:var(--line-2);flex:1}
.orn i{width:6px;height:6px;border:1px solid var(--gold);transform:rotate(45deg)}
/* Welcome */
.welcome{justify-content:center;text-align:center;padding-top:36px}
.welcome img{width:150px;height:auto;margin:0 auto 20px;display:block}
.welcome h1{font-size:37px;margin-bottom:6px}
.welcome .sub{max-width:330px;margin:0 auto}
/* Experience */
.exp-list{display:grid;gap:9px}
.exp{width:100%;min-height:62px;border:1px solid var(--line);border-radius:16px;background:rgba(255,253,250,.94);display:flex;align-items:center;gap:13px;padding:13px 14px;cursor:pointer;color:var(--ink);box-shadow:var(--sh-sm);text-align:left;transition:.16s var(--ease)}
.exp:hover{border-color:var(--line-2)}
.exp:active{transform:scale(.988)}
.exp.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.exp-emoji{font-size:23px;width:29px;text-align:center}
.exp-copy{display:flex;flex-direction:column;gap:3px}
.exp-title{font-weight:600;font-size:15px}
.exp-stars{display:flex;gap:2px;color:var(--gold);height:12px}
.exp-arrow{margin-left:auto;color:rgba(42,26,27,.3)}
/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:1px solid var(--line);background:rgba(255,253,250,.94);color:var(--ink);border-radius:999px;padding:11px 14px;display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;transition:.15s var(--ease);box-shadow:var(--sh-sm)}
.chip:active{transform:scale(.97)}
.chip.on{border-color:var(--gold);background:var(--gold-soft);color:#3A2B1C}
.chip-ico{display:grid;place-items:center;width:17px}
.count{font-size:12px;color:var(--faint);margin-top:13px}
/* Textarea */
.ta{width:100%;min-height:142px;border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:15px 16px;color:var(--ink);font-size:15.5px;line-height:1.56;resize:vertical;box-shadow:var(--sh-sm)}
.ta:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.ta::placeholder{color:rgba(42,26,27,.42)}
.mic{margin-top:11px;border:1px dashed var(--line-2);border-radius:999px;background:transparent;color:var(--muted);padding:10px 14px;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.mic.rec{border-style:solid;border-color:var(--wine);color:var(--wine);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.55}}
/* Buttons */
.btn{width:100%;min-height:52px;border-radius:14px;border:1px solid transparent;padding:13px 16px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:.15s var(--ease)}
.btn:active{transform:scale(.99)}
.btn-primary{background:var(--wine);color:#fff;box-shadow:0 12px 24px -18px rgba(83,16,26,.85)}
.btn-primary:hover{background:var(--burg)}
.btn-primary:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.btn-gold{background:linear-gradient(135deg,#E2C389,#B89561 55%,#9C7A47);color:var(--burg);border-color:#A98449;box-shadow:0 12px 26px -18px rgba(82,57,20,.8)}
.btn-ghost{background:rgba(255,253,250,.75);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--line-2)}
.btn-link{background:none;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px;width:100%}
.btn-row{display:flex;gap:9px}.btn-row .btn{flex:1}
.hint{text-align:center;color:var(--faint);font-size:11.5px;line-height:1.45;margin-top:9px}
/* Generating */
.gen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px}
.ring{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line-2);border-top-color:var(--wine);border-right-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-title{font-family:var(--serif);font-size:22px;font-weight:500}
.gen-sub{color:var(--muted);font-size:13px;margin-top:6px}
.shim{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--line),var(--gold-soft),var(--line));background-size:240% 100%;animation:sh 1.3s linear infinite;margin:10px auto 0;width:200px}
.shim.sm{width:145px;margin-top:7px}
@keyframes sh{to{background-position:-120% 0}}
/* Review card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh-md)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.stars{display:flex;gap:3px;color:var(--gold)}
.stars svg.off{opacity:.2}
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:5px 9px}
.review-text{font-family:var(--serif);font-size:18.5px;line-height:1.56;white-space:pre-wrap;color:#2D2322}
.review-edit{min-height:200px;background:#FFFEFC;box-shadow:none;font-family:var(--sans);font-size:15.5px}
.card-meta{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:13px}
.tone-wrap{margin-top:16px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.tones{display:flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--parch);width:max-content;max-width:100%}
.tone{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.tone.on{background:var(--paper);color:var(--ink);box-shadow:var(--sh-sm);font-weight:600}
/* Share */
.ok{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:13px;background:var(--green-soft);color:var(--green);font-size:12.5px;border:1px solid #D9E6DE;margin-top:12px}
.spacer{flex:1;min-height:20px}
.priv{border:1px solid var(--line);border-radius:16px;background:rgba(255,253,250,.72);padding:13px 14px;color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:14px}
/* Success */
.success{justify-content:center;text-align:center}
.tick{width:68px;height:68px;border-radius:50%;background:var(--gold-soft);color:var(--gold-dk);display:grid;place-items:center;margin:0 auto 20px;border:1px solid #E9D6B6}
.success h1{font-size:34px}
.success .sub{max-width:330px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--burg);color:#F4EDE3;padding:11px 16px;border-radius:999px;font-size:12.5px;box-shadow:var(--sh-lg);z-index:20;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.fade{animation:fade .34s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(() => {

/* ---- Clause banks. Fragments, not sentences, so they can be combined. ---- */
const CLAUSES = {

const OPENERS = {
  excellent:["We had a wonderful experience at City Garden","City Garden gave us a truly memorable celebration","We are really glad we chose City Garden","City Garden turned out to be a lovely choice"],

const CLOSERS = {

  mid:["There were good parts along with a few things to fix.","Overall it was a mixed experience for us.","A few improvements would make a real difference."],
  neg:["I hope the team takes this as useful feedback.","There is clear room for improvement here.","I hope this is sorted out for future guests."]

const FILLERS = {

  mid:["The venue has a good base to work with, and a little more polish would lift the whole experience.","There were things we appreciated and a few that could have been smoother.","Our experience sat somewhere in the middle, with both good moments and gaps.","Nothing went badly wrong, but a few things needed more follow-up than we expected.","It did the job for our function, though we had hoped for a little more.","With tighter coordination this could be a comfortable recommendation."],

/* ---- Search phrases, written the way a person would actually say them. ----
   Used sparingly: at most one or two per review. A review stuffed with search

const KW = {
  seeking: {

  rating:["one of the best marriage lawns in Varanasi","one of the best wedding venues in Varanasi","one of the best banquet halls in Varanasi","one of the better wedding venues we looked at in Varanasi"]

const OCCASIONS = [
  [/\bwalima\b/,"walima"],[/\breception\b/,"reception"],[/\bsangeet\b/,"sangeet"],
  [/\bmehendi|mehandi\b/,"mehendi"],[/\bhaldi\b/,"haldi"],
  [/\bengagement|ring ceremony\b/,"engagement"],[/\bbirthday\b/,"birthday"],
  [/\banniversary\b/,"anniversary"],[/\bwedding|shaadi|shadi|baraat|barat\b/,"wedding"]
];

const LENGTHS = {
  short: { min:35,  max:55,  clauses:2, keywords:1 },
  medium:{ min:70,  max:105, clauses:4, keywords:1 },
  long:  { min:130, max:180, clauses:6, keywords:1 }

/* ------------------------- helpers ------------------------- */
const wordCount = s => (s||"").trim().split(/\s+/).filter(Boolean).length;
const pick = (a,i=0) => a && a.length ? a[((i % a.length)+a.length) % a.length] : "";
const uniq = a => [...new Set(a.filter(Boolean))];
const cap = s => s ? s[0].toUpperCase()+s.slice(1) : s;
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tidy(t){
  let s=(t||"").trim().replace(/\s+/g," ");
  if(!s) return "";
  s=cap(s);
  if(!/[.!?…]$/.test(s)) s+=".";
  return s;
}

function detectOccasion(comment){
  const s=(comment||"").toLowerCase();
  for(const [re,name] of OCCASIONS) if(re.test(s)) return name;
  return "";
}

function keywordPool({stars,topics,comment}){
  const s=(comment||"").toLowerCase();
  let pool=[...KW.seeking.core];
  if(topics.includes("space"))   pool.push(...KW.seeking.space);
  if(topics.includes("decor"))   pool.push(...KW.seeking.decor);
  if(topics.includes("food"))    pool.push(...KW.seeking.food);
  if(topics.includes("parking")) pool.push(...KW.seeking.parking);
  if(topics.includes("staff"))   pool.push(...KW.seeking.staff);
  if(/\broom|rooms|accommodation|stay\b/.test(s)) pool.push(...KW.seeking.rooms);
  const occ=detectOccasion(comment);
  if(occ && KW.occasion[occ]) pool.push(...KW.occasion[occ]);
  if(/chaukaghat/.test(s))               pool.push(...KW.local.chaukaghat);
  if(/cantt|cantonment/.test(s))         pool.push(...KW.local.cantt);
  if(/andhrapull|andhra pull/.test(s))   pool.push(...KW.local.andhrapull);
  return uniq(pool);
}

function keywordSentence(k,mood,v){
  if(!k) return "";
  if(mood==="pos") return pick([
    `If you are looking for ${k}, this one is worth seeing.`,
    `Worth a visit if you need ${k}.`,
    `Easy to recommend to anyone searching for ${k}.`,
    `We would suggest it to anyone looking for ${k}.`
  ],v);
  return `If you are comparing options for ${k}, do check the details that matter most to your function.`;
}

function ratingSentence(k,v){
  return pick([`We would rate it ${k}.`,`For our family it is ${k}.`,`Going by our experience it is ${k}.`],v);
}

/* "marriage lawn in Varanasi" three times over reads like an advertisement and
   is what gets a review taken down. Pick a rating phrase built on a different
   noun from the one already used. */
const headNoun = s => ((s||"").match(/marriage lawns?|wedding venues?|banquet halls?|marriage halls?|wedding lawns?/)||[""])[0].replace(/s\b/,"");
function freshRating(usedPhrase,v){
  const used=headNoun(usedPhrase);
  const opts=KW.rating.filter(k=>headNoun(k)!==used);
  return pick(opts.length?opts:KW.rating,v);
}

/* Join clause fragments into sentences, two at a time where they read well. */
function sentencesFrom(clauses,variant){
  const out=[]; let i=0;
  while(i<clauses.length){
    const a=clauses[i], b=clauses[i+1];
    if(b && (i+variant)%2===0){ out.push(cap(a)+", and "+b+"."); i+=2; }
    else { out.push(cap(a)+"."); i+=1; }
  }
  return out;
}

/* ---------------------- the local drafter ---------------------- */
function draftReview({experience,topics,comment},length="medium",variant=0){
  const exp = EXPERIENCES.find(e=>e.id===experience) || EXPERIENCES[1];
  const mood = exp.stars>=4 ? "pos" : exp.stars===3 ? "mid" : "neg";
  const rule = LENGTHS[length] || LENGTHS.medium;
  const own = tidy(comment);
  const lower = (comment||"").toLowerCase();
  const occ = detectOccasion(comment);

  // The occasion is detected only from the guest's own line, so repeating it in the
  // opener would echo the sentence that follows. It steers keyword choice instead.
  const parts=[pick(OPENERS[exp.id]||OPENERS.verygood, variant)+"."];

  // The guest's own words come first — they are the real review.
  if(own) parts.push(own);

  // Only topics the guest ticked, and only those they have not already covered
  // themselves, so the draft never repeats or contradicts their own sentence.
  const usable = topics.filter(id => id!=="other" && CLAUSES[id]).filter(id=>{
    const t=TOPICS.find(x=>x.id===id);
    return !(t && t.keys.some(k=>lower.includes(k)));
  });

  const clauses=[];
  if(usable.length){
    for(let i=0;i<rule.clauses;i++){
      const id=usable[i%usable.length];
      const c=pick(CLAUSES[id][mood], variant+Math.floor(i/usable.length)+i);
      if(c && !clauses.includes(c)) clauses.push(c);
    }
  }
  parts.push(...sentencesFrom(clauses,variant));

  // A light touch of search language, and none at all on 1–2 star reviews —
  // promotional phrasing has no place in a complaint.
  if(exp.stars>=3){
    const pool=keywordPool({stars:exp.stars,topics,comment});
    const used=[];
    const want=Math.min(rule.keywords,pool.length);
    for(let i=0;i<want;i++){
      const k=pool[(variant*3+i*7)%pool.length];
      const line=keywordSentence(k,mood,variant+i);
      if(line && !used.includes(line)){ used.push(line); parts.push(line); }
    }
    if(exp.stars===5 && length==="long"){
      parts.push(ratingSentence(freshRating(used[0]||"",variant),variant));
    }
  }

  parts.push(pick(CLOSERS[mood],variant));

  // Top up to the requested length with neutral lines that match the rating.
  let f=variant;
  while(wordCount(parts.join(" "))<rule.min && f<variant+12){
    const line=pick(FILLERS[mood],f++);
    if(line && !parts.includes(line)) parts.splice(Math.max(1,parts.length-1),0,line);
    else break;
  }

  return parts.join(" ").replace(/\s+/g," ").trim();
}

/* ------- optional AI polish, if an endpoint has been configured ------- */
async function aiDraft(payload){
  if(!BUSINESS.aiEndpoint) return null;
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),9000);
  try{
    const r=await fetch(BUSINESS.aiEndpoint,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload),
      signal:ctrl.signal
    });
    clearTimeout(timer);
    if(!r.ok) return null;
    const data=await r.json();
    const text=String((data && (data.review||data.text)) || "").trim();
    return (text && wordCount(text)>=20) ? text : null;
  }catch(e){ clearTimeout(timer); return null; }
}

function track(event,detail){
  try{
    window.dispatchEvent(new CustomEvent("citygarden:review",{detail:Object.assign({event},detail||{})}));
    if(window.gtag) window.gtag("event","review_"+event,detail||{});
  }catch(e){}

let toastTimer;
function toast(msg){
  const old=document.querySelector(".toast"); if(old) old.remove();
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.remove(),2300);
}

function go(screen){ st.screen=screen; render(); window.scrollTo(0,0); }

function copySync(text){
  try{
    const ta=document.createElement("textarea");
    ta.value=text; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;left:-9999px;opacity:0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand("copy"); ta.remove(); return ok;
  }catch(e){ return false; }
}
function copyAsync(text){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return copySync(text) ? Promise.resolve() : Promise.reject(new Error("copy failed"));
}

function render(){
  const body = {
    [S.WELCOME]:screenWelcome,[S.EXPERIENCE]:screenExperience,[S.TOPICS]:screenTopics,
    [S.DETAILS]:screenDetails,[S.GENERATING]:screenGenerating,[S.REVIEW]:screenReview,
    [S.SHARE]:screenShare,[S.PRIVATE]:screenPrivate,[S.SUCCESS]:screenSuccess
  }[st.screen]();

  shell.innerHTML =
    (st.screen!==S.WELCOME ? BRAND(BACK[st.screen]!==undefined) : "") +
    PROGRESS(STEP[st.screen]) + body;

  const ta=document.getElementById("comment");
  if(ta) ta.addEventListener("input",e=>{ st.comment=e.target.value; });

  const re=document.getElementById("reviewEdit");
  if(re){
    re.focus();
    re.addEventListener("input",e=>{ st.review=e.target.value; st.edited=true; });
  }

  const pt=document.getElementById("privateText");
  if(pt) pt.addEventListener("input",e=>{
    st.privateText=e.target.value;
    const btn=document.querySelector('[data-act="sendPrivate"]');
    if(btn) btn.disabled=!st.privateText.trim();
  });

  const g=document.getElementById("googleBtn");
  if(g) g.addEventListener("click",()=>{
    // Copy synchronously, inside the tap, while the browser still trusts us.
    // The anchor handles navigation itself — more reliable than a JS redirect.
    const ok=copySync(st.review);
    if(!ok && navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(st.review).catch(()=>{});
    track("open_google",{stars:stars(),copied:ok});
    st.posted=true;
    if(ok) toast("Review copied — opening Google");
    setTimeout(render,400);
  });
}

/* ------------------------- actions ------------------------- */
const build = () => { st.review = draftReview(st,st.length,st.variant); st.edited=false; st.editing=false; };

function confirmLoss(msg){ return !st.edited || window.confirm(msg); }

async function generate(){
  track("generate",{stars:stars(),topics:st.topics.length,hasComment:!!st.comment.trim()});
  go(S.GENERATING);

  const lines=["Turning your notes into a draft…","Keeping it close to what you told us…","Almost ready…"];
  let li=0;
  const spin=setInterval(()=>{
    li=Math.min(li+1,lines.length-1);
    const el=document.getElementById("genLine"); if(el) el.textContent=lines[li];
  },650);

  const started=Date.now();
  const payload={
    business:"City Garden, a marriage lawn and banquet hall in Chaukaghat, Varanasi",
    stars:stars(),
    experience:(EXPERIENCES.find(e=>e.id===st.experience)||{}).label||"",
    topics:st.topics.map(id=>(TOPICS.find(t=>t.id===id)||{}).label).filter(Boolean),
    comment:st.comment.trim(),
    length:st.length,
    targetWords:[LENGTHS[st.length].min,LENGTHS[st.length].max],
    variant:st.variant,
    keywords:keywordPool({stars:stars(),topics:st.topics,comment:st.comment}).slice(0,6)
  };

  let text=null;
  try{ text=await aiDraft(payload); }catch(e){ text=null; }

  st.engine = text ? "ai" : "local";
  if(text){ st.review=text; st.edited=false; st.editing=false; }
  else build();

  clearInterval(spin);
  const wait=Math.max(0,900-(Date.now()-started));
  setTimeout(()=>{ track("drafted",{engine:st.engine,words:wordCount(st.review)}); go(S.REVIEW); },wait);
}

function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const msg=document.getElementById("micMsg");
  const btn=document.getElementById("mic");
  if(!SR){ if(msg) msg.textContent="Voice input isn't supported in this browser — typing works just as well."; return; }
  const r=new SR();
  r.lang="en-IN"; r.interimResults=false; r.maxAlternatives=1;
  r.onresult=ev=>{
    const t=ev.results[0][0].transcript;
    st.comment=(st.comment?st.comment+" ":"")+t;
    const ta=document.getElementById("comment"); if(ta) ta.value=st.comment;
  };
  r.onerror=()=>{ if(msg) msg.textContent="Couldn't catch that. Try again, or just type it."; if(btn) btn.classList.remove("rec"); };
  r.onend=()=>{ if(btn){ btn.classList.remove("rec"); btn.innerHTML=I.mic+"Speak instead"; } };
  if(msg) msg.textContent="";
  if(btn){ btn.classList.add("rec"); btn.innerHTML=I.mic+"Listening… tap to stop"; }
  r.start();
}

shell.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;

  if(act==="back"){ const b=BACK[st.screen]; if(b!==undefined) go(b); return; }
  if(act==="start"){ track("start"); go(S.EXPERIENCE); return; }

  if(act==="exp"){
    st.experience=id;
    track("rated",{stars:(EXPERIENCES.find(x=>x.id===id)||{}).stars});
    render();
    setTimeout(()=>go(S.TOPICS),150);
    return;
  }
  if(act==="topic"){
    st.topics = st.topics.includes(id) ? st.topics.filter(x=>x!==id) : st.topics.concat(id);
    render(); return;
  }
  if(act==="toDetails"){ go(S.DETAILS); return; }
  if(act==="mic"){ startVoice(); return; }
  if(act==="generate"){ generate(); return; }

  if(act==="len"){
    if(!confirmLoss("Changing the length will replace the edits you made. Continue?")) return;
    st.length=id; build(); render(); return;
  }
  if(act==="again"){
    if(!confirmLoss("A new version will replace the edits you made. Continue?")) return;
    st.variant++; build(); render(); track("new_version",{variant:st.variant}); return;
  }
  if(act==="edit"){ st.editing=!st.editing; render(); return; }
  if(act==="toShare"){ go(S.SHARE); return; }
  if(act==="copyOnly"){
    copyAsync(st.review).then(()=>toast("Review copied")).catch(()=>toast("Select the text above and copy it"));
    track("copy_only",{stars:stars()}); return;
  }
  if(act==="toPrivate"){
    st.privateText = st.privateText || st.comment;
    track("private_opened",{stars:stars()});
    go(S.PRIVATE); return;
  }
  if(act==="sendPrivate"){
    const subject=encodeURIComponent("Feedback for City Garden");
    const body=encodeURIComponent(st.privateText.trim());
    track("private_sent",{stars:stars()});
    location.href=`mailto:${BUSINESS.email}?subject=${subject}&body=${body}`;
    return;
  }
  if(act==="done"){ track("marked_posted",{stars:stars()}); go(S.SUCCESS); return; }
});

render();
})();
</script>
</body>
</html>
